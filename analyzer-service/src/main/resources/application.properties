spring.application.name=analyzer-service
server.port=8082

# Google genai
spring.ai.google.genai.api-key=${GEMINI_TEST_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=analyzer-group

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ogidazepam.analyzer_service.model.offer.JobOffer