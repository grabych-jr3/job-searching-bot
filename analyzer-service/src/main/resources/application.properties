spring.application.name=analyzer-service

# Google genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# Producer properties
spring.kafka.producer.properties.spring.json.type.mapping=analyzed-offer:com.ogidazepam.analyzer_service.model.event.AnalyzedOfferEvent
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=analyzer-group
spring.kafka.consumer.auto-offset-reset=earliest

# Consumer properties
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ogidazepam.analyzer_service.model.*
spring.kafka.consumer.properties.spring.json.type.mapping=found-offer:com.ogidazepam.analyzer_service.model.event.JobOfferEvent

spring.profiles.active=dev