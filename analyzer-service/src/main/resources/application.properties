spring.application.name=analyzer-service
server.port=8083

# Google genai
spring.ai.google.genai.api-key=${GEMINI_TEST_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Producer properties
spring.kafka.producer.properties.spring.json.type.mapping=analyzed-offer:com.ogidazepam.analyzer_service.model.event.AnalyzedOfferEvent

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=analyzer-group

# Consumer properties
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ogidazepam.analyzer_service.model
spring.kafka.consumer.properties.spring.json.type.mapping=found-offer:com.ogidazepam.analyzer_service.model.event.JobOfferEvent