<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Analyzer</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <main class="page-shell">
        <section class="upload-card">
            <h1>Upload file for analysis</h1>

            <form id="uploadForm" class="upload-form">
                <fieldset class="filter-fieldset">
                    <legend>Technology <span class="required-mark">*</span></legend>
                    <div class="option-list option-list-radio">
                        <label class="option-item"><input type="radio" name="technology" value="java" required>Java</label>
                        <label class="option-item"><input type="radio" name="technology" value="javascript">JavaScript</label>
                        <label class="option-item"><input type="radio" name="technology" value="python">Python</label>
                        <label class="option-item"><input type="radio" name="technology" value="c">C</label>
                        <label class="option-item"><input type="radio" name="technology" value="net">.NET</label>
                        <label class="option-item"><input type="radio" name="technology" value="go">Go</label>
                        <label class="option-item"><input type="radio" name="technology" value="php">PHP</label>
                    </div>
                </fieldset>

                <fieldset class="filter-fieldset">
                    <legend>Experience level <span class="required-mark">*</span></legend>
                    <div class="option-list">
                        <label class="option-item"><input type="checkbox" name="experience" value="intern">Intern</label>
                        <label class="option-item"><input type="checkbox" name="experience" value="junior">Junior</label>
                        <label class="option-item"><input type="checkbox" name="experience" value="mid">Mid</label>
                        <label class="option-item"><input type="checkbox" name="experience" value="senior">Senior</label>
                    </div>
                </fieldset>

                <fieldset class="filter-fieldset">
                    <legend>Work modes</legend>
                    <div class="option-list">
                        <label class="option-item"><input type="checkbox" name="workMode" value="full-office">Full-office</label>
                        <label class="option-item"><input type="checkbox" name="workMode" value="hybrid">Hybrid</label>
                        <label class="option-item"><input type="checkbox" name="workMode" value="remote">Remote</label>
                    </div>
                </fieldset>

                <label class="file-picker" for="fileInput">
                    <span class="file-picker-label">Choose file</span>
                    <input id="fileInput" type="file" name="file" required>
                </label>

                <button type="submit" id="submitBtn">Send</button>
            </form>

            <div id="status" class="status" aria-live="polite">No file selected.</div>
        </section>

        <section class="results-panel" aria-live="polite">
            <div class="results-controls">
                <div class="filter-group" aria-label="Filter offers by score range">
                    <button class="filter-btn active" data-filter="all" type="button">All</button>
                    <button class="filter-btn" data-filter="0-49" type="button">0-49</button>
                    <button class="filter-btn" data-filter="50-69" type="button">50-69</button>
                    <button class="filter-btn" data-filter="70-79" type="button">70-79</button>
                    <button class="filter-btn" data-filter="80-100" type="button">80-100</button>
                </div>
                <button id="sortBtn" class="sort-btn" type="button">Sort by score</button>
            </div>
            <div id="resultsContainer" class="results-container">
                <div class="empty-state">No job offers analyzed yet.</div>
            </div>
        </section>
    </main>

    <script src="home.js"></script>
</body>
</html>
